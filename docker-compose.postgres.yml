# The app with PostgreSQL instead of SQLite: docker compose -f docker-compose.postgres.yml up -d --build
# Secrets come from the environment or a gitignored `.env` file next to this file.
# See .env.example and README.md.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      # Over TCP: during the image's first-start init, a temporary server answers only on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    image: test-tracker
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4100}:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ chars, openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public https origin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The password must be URL-safe here, or percent-encoded (see README "Database").
      DATABASE_URL: postgres://tracker:${POSTGRES_PASSWORD}@db:5432/tracker
      # Attachments (README "Attachments"): unset disables them.
      ATTACHMENTS_BUCKET_URL: ${ATTACHMENTS_BUCKET_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
